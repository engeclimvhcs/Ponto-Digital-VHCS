<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ponto Eletrônico Digital</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .app-container {
            background: var(--card);
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .tabs {
            display: flex;
            background: #e2e8f0;
            border-bottom: 2px solid #cbd5e1;
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            color: #64748b;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: var(--primary);
            background: var(--card);
            border-bottom: 3px solid var(--primary);
        }
        .content {
            padding: 20px;
            display: none;
        }
        .content.active {
            display: block;
        }
        h2 {
            margin-top: 0;
            color: #0f172a;
            font-size: 22px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .camera-container {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            background: #f1f5f9;
            margin-bottom: 16px;
        }
        video, img {
            width: 100%;
            max-height: 240px;
            border-radius: 8px;
            object-fit: cover;
            display: none;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: #64748b; color: white; margin-bottom: 10px; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .status-panel {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .status-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            margin-right: 8px;
            color: white;
        }
        .badge-success { background: var(--success); }
        .badge-danger { background: var(--danger); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('ponto')">Bater Ponto</button>
        <button class="tab-btn" onclick="switchTab('admin')">Painel Admin</button>
    </div>

    <div id="tab-ponto" class="content active">
        <h2>Registro de Ponto</h2>
        <form id="pontoForm" onsubmit="enviarPonto(event)">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Seu nome" oninput="validarFormulario()">
            </div>
            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14" oninput="aplicarMascaraCPF(this)">
            </div>

            <div class="camera-container">
                <video id="video" autoplay playsinline muted></video>
                <img id="fotoPreview" alt="Sua foto">
                <button type="button" id="btnStream" class="btn btn-secondary" onclick="iniciarCameraVideo()">Ativar Câmera ao Vivo</button>
                <button type="button" id="btnCapturar" class="btn btn-success" style="display:none;" onclick="tirarFotoDoVideo()">Capturar Foto</button>
                <input type="file" id="cameraNativa" accept="image/*" capture="user" style="display:none;" onchange="carregarFotoNativa(this)">
                <button type="button" id="btnNativo" class="btn btn-secondary" onclick="document.getElementById('cameraNativa').click()">Câmera Alternativa</button>
            </div>

            <div class="status-panel">
                <div class="status-item"><span id="badgeGps" class="badge badge-danger">OFF</span><span id="txtGps">GPS: Aguardando...</span></div>
                <div class="status-item"><span id="badgeCam" class="badge badge-danger">OFF</span><span id="txtCam">Câmera: Ausente</span></div>
                <div class="status-item"><span class="badge badge-success">LIVE</span><span id="txtTempo">Carregando relógio...</span></div>
            </div>

            <button type="submit" id="btnEnviar" class="btn btn-primary" disabled>Confirmar e Enviar Ponto</button>
        </form>
    </div>

    <div id="tab-admin" class="content">
        <h2>Painel Administrativo</h2>
        <div id="adminAuth">
            <div class="form-group">
                <label>Senha de Acesso</label>
                <input type="password" id="senhaAdmin" placeholder="Digite a senha">
            </div>
            <button class="btn btn-primary" onclick="verificarSenha()">Acessar Relatórios</button>
        </div>
        <div id="adminData" style="display:none;">
            <p style="color:var(--success); font-weight:bold; text-align:center;">🔓 Acesso Permitido</p>
            <div class="form-group">
                <label>Filtrar por Data</label>
                <input type="date" id="filtroData">
            </div>
            <div id="listaPontos">Nenhum ponto recebido.</div>
        </div>
    </div>
</div>

<script>
    const URL_GOOGLE_SHEETS = "SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI";

    let dadosPonto = { nome: "", cpf: "", foto: "", lat: "", lng: "", dataHora: "" };
    let streamDeVideo = null;

    function switchTab(tab) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function obterLocalizacao() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    dadosPonto.lat = position.coords.latitude;
                    dadosPonto.lng = position.coords.longitude;
                    document.getElementById('badgeGps').className = "badge badge-success";
                    document.getElementById('badgeGps').innerText = "OK";
                    document.getElementById('txtGps').innerHTML = `GPS Conectado`;
                    validarFormulario();
                },
                () => {
                    alert("Por favor, ative a localização do seu dispositivo nas configurações do navegador.");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    }
    window.addEventListener('DOMContentLoaded', obterLocalizacao);

    setInterval(() => {
        dadosPonto.dataHora = new Date().toLocaleString('pt-BR');
        document.getElementById('txtTempo').innerText = dadosPonto.dataHora;
    }, 1000);

    function aplicarMascaraCPF(input) {
        let v = input.value.replace(/\D/g, "");
        v = v.replace(/(\d{3})(\d)/, "\$1.\$2");
        v = v.replace(/(\d{3})(\d)/, "\$1.\$2");
        v = v.replace(/(\d{3})(\d{1,2})\$/, "\$1-\$2");
        input.value = v;
        validarFormulario();
    }

    async function iniciarCameraVideo() {
        try {
            streamDeVideo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
            const video = document.getElementById('video');
            video.srcObject = streamDeVideo;
            video.style.display = "block";
            document.getElementById('fotoPreview').style.display = "none";
            document.getElementById('btnStream').style.display = "none";
            document.getElementById('btnCapturar').style.display = "block";
        } catch {
            alert("Acesso direto bloqueado. Use o botão Câmera Alternativa.");
        }
    }

    function tirarFotoDoVideo() {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        salvarFoto(canvas.toDataURL('image/jpeg', 0.6));
        if (streamDeVideo) streamDeVideo.getTracks().forEach(t => t.stop());
        video.style.display = "none";
        document.getElementById('btnCapturar').style.display = "none";
        document.getElementById('btnStream').style.display = "block";
    }

    function carregarFotoNativa(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => salvarFoto(e.target.result);
            reader.readAsDataURL(input.files[0]);
        }
    }

    function salvarFoto(base64) {
        dadosPonto.foto = base64;
        const preview = document.getElementById('fotoPreview');
        preview.src = base64;
        preview.style.display = "block";
        document.getElementById('badgeCam').className = "badge badge-success";
        document.getElementById('badgeCam').innerText = "OK";
        document.getElementById('txtCam').innerText = "Foto pronta";
        validarFormulario();
    }

    function validarFormulario() {
        const nome = document.getElementById('nome').value.trim();
        const cpf = document.getElementById('cpf').value.trim();
        document.getElementById('btnEnviar').disabled = !(nome && cpf.length === 14 && dadosPonto.foto && dadosPonto.lat);
    }

    function verificarSenha() {
        if(document.getElementById('senhaAdmin').value === "051116mm") {
            document.getElementById('adminAuth').style.display = "none";
            document.getElementById('adminData').style.display = "block";
        } else {
            alert("Senha incorreta!");
        }
    }

    function enviarPonto(e) {
        e.preventDefault();
        dadosPonto.nome = document.getElementById('nome').value;
        dadosPonto.cpf = document.getElementById('cpf').value;

        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        btn.innerText = "Sincronizando...";

        if(URL_GOOGLE_SHEETS.includes("SUA_URL")) {
            alert("Local salvo com sucesso! Para enviar em tempo real ao Sheets, conecte a URL gerada no Apps Script na linha 144 do código.");
            btn.disabled = false;
            btn.innerText = "Confirmar e Enviar Ponto";
            return;
        }

        fetch(URL_GOOGLE_SHEETS, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dadosPonto)
        }).then(() => {
            alert("Ponto registrado e enviado com sucesso ao Google Planilhas!");
            location.reload();
        }).catch(() => {
            alert("Erro na sincronização.");
            btn.disabled = false;
            btn.innerText = "Confirmar e Enviar Ponto";
        });
    }
</script>
</body>
</html>
